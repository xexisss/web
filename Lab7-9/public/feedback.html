<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отзывы | HEALTCARE</title>
  <link rel="stylesheet" href="css/feedback.css">
  <link rel="stylesheet" href="css/preloader.css">
</head>
<body>
  <header>
    <h1 class="brand">HEALTCARE</h1>
  </header>
  <main>
    <h2>Отзывы пациентов</h2>
    <form id="feedbackForm" autocomplete="off" novalidate>
      <div class="form-group">
        <label>Выберите услугу*:
          <select id="serviceSelect">
            <option value="">-- не выбрано --</option>
          </select>
        </label>
        <div class="error" id="service-error"></div>
      </div>
      <div class="form-group">
        <label>Оценка*:
          <select id="ratingSelect">
            <option value="">-- не выбрано --</option>
            <option value="5">Отлично ★★★★★</option>
            <option value="4">Хорошо ★★★★☆</option>
            <option value="3">Удовлетворительно ★★★☆☆</option>
            <option value="2">Плохо ★★☆☆☆</option>
            <option value="1">Ужасно ★☆☆☆☆</option>
          </select>
        </label>
        <div class="error" id="rating-error"></div>
      </div>
      <div class="form-group">
        <label>Ваш отзыв*:
          <textarea id="feedbackText" rows="4" maxlength="300"></textarea>
        </label>
        <div class="error" id="feedbackText-error"></div>
      </div>
      <button type="submit" id="feedbackBtn" disabled>Отправить отзыв</button>
      <div id="feedback-success"></div>
    </form>

    <section id="reviews-section">
      <h3 style="text-align:center;margin-top:2em;">Отзывы о выбранной услуге</h3>
      <div id="product-reviews"></div>
    </section>
  </main>
  <script src="js/feedback.js"></script>
  <script src="js/preloader.js"></script>
</body>
</html>
